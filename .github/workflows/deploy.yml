name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/dreamy-goldberg-f954e9]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub also publishes the raw
      # source for this commit. Wait for that to finish so the built game lands last.
      - name: Wait for branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            echo "branch build runs still going: $pending"
            [ "$pending" = "0" ] && break
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
